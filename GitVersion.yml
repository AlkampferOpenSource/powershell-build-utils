mode: ContinuousDelivery
increment: Patch
commit-message-incrementing: Enabled

branches:
  main:
    regex: ^master$|^main$
    label: ''
    increment: Patch
    is-main-branch: true
  develop:
    mode: ContinuousDelivery
    label: alpha
    increment: Minor
    regex: ^dev(elop)?(ment)?$
    source-branches:
      - main
  feature:
    mode: ContinuousDelivery
    label: '{BranchName}'
    increment: Minor
    regex: ^features?[\/-](?<BranchName>.+)
    source-branches:
      - develop
      - main
      - release
  hotfix:
    mode: ContinuousDelivery
    label: '{BranchName}'
    increment: Patch
    regex: ^hotfix(es)?[\/-](?<BranchName>.+)
    source-branches:
      - main
      - support
    is-release-branch: true
  release:
    mode: ContinuousDelivery
    label: beta
    increment: Minor
    regex: ^releases?[\/-](?<BranchName>.+)
    source-branches:
      - main
      - support
    is-release-branch: true

ignore:
  sha: []
merge-message-formats: {}
